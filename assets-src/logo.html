<!doctype html>
<html><head><style>body{margin:0}</style></head><body>
<svg id="logo" width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1e40af"/>
    </linearGradient>
    <linearGradient id="pen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- app tile background -->
  <rect x="0" y="0" width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- writing pad -->
  <g transform="rotate(-4 256 276)">
    <rect x="116" y="140" width="280" height="292" rx="24" fill="#eef2f7"/>
    <rect x="116" y="140" width="280" height="52" rx="24" fill="#cbd5e1"/>
    <rect x="116" y="168" width="280" height="24" fill="#cbd5e1"/>
    <!-- spiral binding -->
    <g fill="#64748b">
      <circle cx="156" cy="166" r="9"/><circle cx="206" cy="166" r="9"/>
      <circle cx="256" cy="166" r="9"/><circle cx="306" cy="166" r="9"/>
      <circle cx="356" cy="166" r="9"/>
    </g>
    <!-- ruled lines, last one being "written" -->
    <g stroke="#94a3b8" stroke-width="12" stroke-linecap="round">
      <line x1="152" y1="240" x2="360" y2="240"/>
      <line x1="152" y1="292" x2="360" y2="292"/>
      <line x1="152" y1="344" x2="286" y2="344"/>
    </g>
  </g>

  <!-- pen writing on the pad -->
  <g transform="rotate(40 330 330)">
    <!-- barrel -->
    <rect x="302" y="128" width="56" height="230" rx="16" fill="url(#pen)"/>
    <!-- grip band -->
    <rect x="302" y="322" width="56" height="26" fill="#92400e"/>
    <!-- nib -->
    <path d="M302 358 L330 428 L358 358 Z" fill="#f8fafc"/>
    <path d="M322 358 L330 400 L338 358 Z" fill="#475569"/>
    <!-- clip -->
    <rect x="322" y="118" width="16" height="44" rx="8" fill="#fde68a"/>
  </g>

  <!-- ink stroke coming from the nib -->
  <path d="M150 452 Q 220 420 286 442" stroke="#0f172a" stroke-width="14" fill="none" stroke-linecap="round" opacity="0.55"/>
</svg>
</body></html>
